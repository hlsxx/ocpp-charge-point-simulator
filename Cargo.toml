[workspace]
resolver = "3"
members = [
  "app",
  "crates/ocpp",
  "crates/cp",
  "crates/common"
]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.105"
async-trait = "0.1.92"
tokio = { version = "1.54.1", features = ["full"] }
rand = "0.10.4"
tracing = "0.1.44"
colored = "3.1.1"
futures-util = "0.3.34"
